<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لایت‌باکس فریم‌لس | نامور</title>
<style>
:root{
  --bg:#0e1116;--panel:#161b22;--panel2:#1c2230;--line:#2a3240;
  --ink:#e8edf2;--mut:#8b97a7;--acc:#ffb000;--acc2:#3ea6ff;
  --ok:#3ad17b;--warn:#ff7a59;--led:#ffd24d;--pwr:#ff5e7a;
  --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 120% 60% at 80% -10%,#1a2331 0,var(--bg) 55%);
  color:var(--ink);font-family:"Vazirmatn","Segoe UI",Tahoma,sans-serif;line-height:1.6;
  min-height:100vh;padding:12px}
.site-header{max-width:1180px;margin:0 auto 14px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:#000;border:1px solid #000;border-radius:var(--radius);padding:12px 20px}
.brand{display:flex;align-items:center;gap:14px;flex-shrink:0}
.brand img{height:46px;width:auto;display:block}
.brand-text h1{font-size:15px;margin:0 0 1px;color:var(--ink);font-weight:700}
.brand-text p{color:var(--mut);font-size:11px;margin:0}
.login-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.login-bar input{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:7px 9px;border-radius:8px;font-size:13px;font-family:inherit;outline:none;width:110px;min-width:0}
.login-bar input:focus{border-color:var(--acc2)}
.lbtn{background:var(--panel2);border:1px solid var(--acc2);color:var(--acc2);
  padding:7px 12px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.lbtn:hover{background:var(--acc2);color:#0e1116}
.admin-badge{background:rgba(255,176,0,.12);border:1px solid var(--acc);color:var(--acc);
  padding:5px 12px;border-radius:20px;font-size:12px;display:none;cursor:pointer;white-space:nowrap;align-items:center;gap:6px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--mut);display:inline-block;flex-shrink:0}
.sync-dot.ok{background:var(--ok)}.sync-dot.busy{background:var(--acc);animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--acc2);margin:0 0 12px}
label{display:block;font-size:12px;color:var(--mut);margin:9px 0 3px}
input[type=number],select{width:100%;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);padding:9px 10px;border-radius:9px;font-size:14px;font-family:inherit;outline:none;-webkit-appearance:none;appearance:none}
input[type=number]:focus,select:focus{border-color:var(--acc2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--acc),#ff8c00);
  color:#1a1205;border:0;padding:13px;border-radius:10px;font-weight:700;font-size:15px;
  cursor:pointer;font-family:inherit;transition:.15s;touch-action:manipulation}
.btn:active{filter:brightness(.93)}
.btn-s{background:var(--panel2);border:1px solid var(--ok);color:var(--ok);
  padding:9px 14px;border-radius:9px;font-size:13px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s;flex:1}
.btn-s:hover{background:var(--ok);color:#0e1116}
.btn-s.blue{border-color:var(--acc2);color:var(--acc2)}
.btn-s.blue:hover{background:var(--acc2);color:#0e1116}
.admin-section{display:none}
.admin-mode .admin-section{display:block!important}
.price-big{font-size:30px;font-weight:800;color:var(--acc);line-height:1.2}
.price-big small{font-size:13px;color:var(--mut);font-weight:400}
.hint{color:var(--mut);font-size:11px;margin-top:4px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-size:11px;white-space:nowrap}
.badge b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:10px}
td.num{font-variant-numeric:tabular-nums}
tr.subtotal td{color:var(--mut);font-size:11px}
tr.total td{border-top:2px solid var(--acc);border-bottom:0;font-weight:700;padding-top:9px}
.total td:last-child{color:var(--acc)}
.warnbox{background:rgba(255,122,89,.1);border:1px solid var(--warn);color:#ffb6a3;border-radius:9px;padding:8px 11px;font-size:11px;margin-top:10px}
.schem{background:#07090e;border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-top:14px}
.schem-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg.schema{display:block;width:100%;min-width:300px;height:auto}
.schem-info{text-align:center;color:var(--led);font-size:11px;font-weight:700;margin-top:8px;padding:0 4px;line-height:1.8}
.empty{color:var(--mut);text-align:center;padding:40px 0;font-size:13px}
.card.admin-card{border-color:rgba(255,176,0,.25)}
.mini label{margin:5px 0 2px;font-size:11px}
.mini input{padding:6px 8px;font-size:12px}
.save-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
#saveStatus{font-size:11px;color:var(--mut);min-width:80px}
.jb-section{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.jb-section>label{color:var(--acc2);font-size:11px;font-weight:600;margin-bottom:2px}
.jb-section input{font-size:11px;padding:6px 8px;letter-spacing:.4px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}body{padding:8px}.site-header{padding:10px 14px}}
@media(max-width:500px){
  .site-header{flex-direction:column;align-items:stretch;gap:10px}
  .brand img{height:38px}.brand-text h1{font-size:13px}
  .login-bar{justify-content:center}
  .login-bar input{flex:1;width:auto}
  .lbtn{flex:1;text-align:center}
  .price-big{font-size:26px}
  .badges{gap:4px}.badge{font-size:10px;padding:3px 8px}
  table{font-size:11px}th,td{padding:5px 3px}
  .card{padding:12px}
}
</style>
</head>

// ── GITHUB CONFIG ──
const GH_USER='shahabshamchi';
const GH_REPO='Light-Box-Calculator';
const GH_FILE='prices.json';
const GH_API='https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents/'+GH_FILE;
const GH_RAW='https://raw.githubusercontent.com/'+GH_USER+'/'+GH_REPO+'/main/'+GH_FILE;

async function readFromGitHub(){
  try{
    // raw URL bypasses auth, always latest committed version
    const r=await fetch(GH_RAW+'?t='+Date.now());
    if(!r.ok)throw new Error(r.status);
    return await r.json();
  }catch(e){return null;}
}
async function writeToGitHub(data){
  const token=el('ghToken').value.trim();
  if(!token)return false;
  try{
    setSyncDot('busy');
    // get current SHA (needed for update)
    const meta=await fetch(GH_API,{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}});
    if(!meta.ok)throw new Error('auth: '+meta.status);
    const mj=await meta.json();
    const sha=mj.sha;
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const put=await fetch(GH_API,{
      method:'PUT',
      headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'update prices',content,sha})
    });
    if(!put.ok)throw new Error('write: '+put.status);
    setSyncDot('ok');return true;
  }catch(e){setSyncDot('');console.error(e);return false;}
}
async function saveSettings(){
  const data=fieldsToObj();
  // remove token from saved data for security
  delete data.ghToken;
  saveLocal(data);
  setStatus('در حال ذخیره...','var(--acc)');
  const ok=await writeToGitHub(data);
  setStatus(ok?'✓ ذخیره و sync شد':'✓ ذخیره محلی (Token نداشت)','var(--ok)');
  setTimeout(()=>setStatus(''),3500);
}
async function loadFromGitHub(){
  setStatus('در حال دریافت...','var(--acc2)');
  const data=await readFromGitHub();
  if(data){objToFields(data);saveLocal(data);setStatus('✓ دریافت شد','var(--ok)');}
  else setStatus('خطا در دریافت از GitHub','var(--warn)');
  setTimeout(()=>setStatus(''),4000);
}
async function initSettings(){
  // always load from GitHub raw (public, no auth needed)
  const gh=await readFromGitHub();
  if(gh){objToFields(gh);saveLocal(gh);setSyncDot('ok');}
  else{
    // fallback to localStorage
    const local=loadLocal();
    if(local)objToFields(local);
  }
}

function doLogin(){
  const u=el('uname').value.trim(),p=el('upass').value,ap=el('adminPass').value;
  if(u===ADMIN_USER&&p===ap){
    isAdmin=true;
    el('appWrap').classList.add('admin-mode');
    el('loginBar').style.display='none';
    el('adminBadge').style.display='flex';
  }else{
    el('upass').value='';
    setStatus('نام کاربری یا رمز اشتباه','var(--warn)');
    setTimeout(()=>setStatus(''),3000);
  }
}
function doLogout(){
  if(!confirm('از پنل ادمین خارج شوید؟'))return;
  isAdmin=false;
  el('appWrap').classList.remove('admin-mode');
  el('loginBar').style.display='flex';
  el('adminBadge').style.display='none';
  el('uname').value='';el('upass').value='';setSyncDot('');
}

function profileCalc(W,H){
  const pieces=[W,W,H,H].sort((a,b)=>b-a);const bars=[];
  pieces.forEach(p=>{
    let placed=false;
    for(const b of bars){if(b.rem>=p){b.rem-=p;placed=true;break;}}
    if(!placed)bars.push({rem:PLEN-p});
  });
  let dead=0;bars.forEach(b=>{if(b.rem<PMIN)dead+=b.rem;});
  return{bars:bars.length,charged:pieces.reduce((a,b)=>a+b,0)+dead};
}
function sheetCalc(W,H,type){
  const s=SHEET[type],A=s.w,B=s.h;
  const need=(pw,ph,sw,sh)=>Math.ceil(pw/sw)*Math.ceil(ph/sh);
  const o1=need(W,H,A,B),o2=need(W,H,B,A);
  const sheets=Math.min(o1,o2);
  const sa=A*B,ua=W*H,ta=sheets*sa,wa=ta-ua;
  const orient=o1<=o2?[A,B]:[B,A];
  const rW=orient[0]*Math.ceil(W/orient[0])-W,rH=orient[1]*Math.ceil(H/orient[1])-H;
  return{sheets,totalArea:ta,wasteArea:wa,wastePct:wa/ta*100,useful:(rW>=30||rH>=30)};
}
function ledLayout(Wcm,Hcm){
  const W=Wcm*10,H=Hcm*10,vertical=H>W;
  const along=vertical?H:W,across=vertical?W:H;
  const usableAcross=across-2*LED_MARGIN;
  if(usableAcross<0)return{rows:0,segs:[],stripsPerRow:0,totalStrips:0,rawConsumed:0,totalSMD:0,vertical,W,H,marginAcross:LED_MARGIN,marginAlong:LED_MARGIN};
  const rows=Math.floor(usableAcross/LED_GAP_V)+1;
  const marginAcross=(across-(rows-1)*LED_GAP_V)/2;
  let rem=along-2*LED_MARGIN;const segs=[];
  while(rem>0){
    if(rem>=LED_LEN){segs.push(LED_LEN);rem-=LED_LEN;if(rem>0)rem-=LED_GAP_H;}
    else{const n=Math.floor(rem/LED_CUT);if(n<1)break;segs.push(n*LED_CUT);rem=0;}
  }
  const spanAlong=segs.reduce((a,b)=>a+b,0)+(segs.length-1)*LED_GAP_H;
  const marginAlong=(along-spanAlong)/2;
  const totalStrips=rows*segs.length;
  const rawConsumed=rows*segs.reduce((a,b)=>a+Math.ceil(b/LED_LEN),0);
  const totalSMD=rows*segs.reduce((a,b)=>a+Math.round(b/LED_CUT),0);
  return{rows,segs,stripsPerRow:segs.length,totalStrips,rawConsumed,totalSMD,vertical,W,H,along,across,marginAcross,marginAlong};
}
function powerCalc(br){
  const T=[[5,10,'pw10'],[10,16,'pw16'],[15,25,'pw25'],[20,33,'pw33']];
  const one=b=>{for(const[mx,a,id]of T)if(b<=mx)return{amp:a,id};};
  if(br<=0)return{units:[],cost:0,label:'—'};
  if(br<=20){const u=one(br);return{units:[u.amp],cost:+g(u.id),label:'۱× پاور '+u.amp+'A'};}
  let best=null;
  for(const[cap,id,amp]of[[20,'pw33',33],[15,'pw25',25]]){
    const n=Math.ceil(br/cap),cost=n*+g(id);
    if(!best||cost<best.cost)best={n,cost,amp};
  }
  return{units:Array(best.n).fill(best.amp),cost:best.cost,label:toFa(best.n)+'× پاور '+best.amp+'A'};
}

function calc(){
  const W=+g('W'),H=+g('H'),type=g('back'),ptype=g('prof'),qty=+g('qty');
  const margin=+g('margin')/100,wasteTh=+g('wasteTh')/100;
  if(W<30||H<30||W>600||H>300){alert('ابعاد خارج از محدوده');return;}
  const pr=profileCalc(W,H);const sh=sheetCalc(W,H,type);
  const led=ledLayout(W,H);const pw=powerCalc(led.rawConsumed);
  const cPr=(pr.charged/PLEN)*PROF[ptype].price();
  const cSh=sh.sheets*SHEET[type].price();
  const cLed=led.rawConsumed*+g('p_led');
  const cPow=pw.cost;
  const cPrt=(W*H/10000)*+g('p_print');
  const cLab=(W*H/10000)*+g('p_labor');
  const base=cPr+cSh+cLed+cPow+cPrt+cLab;
  let sur=0,warn='';
  if(sh.wastePct/100>wasteTh&&!sh.useful){sur+=(sh.wasteArea/sh.totalArea)*cSh*0.5;warn+='پرت ورق '+Math.round(sh.wastePct)+'٪  ';}
  const cost=base+sur,unit=cost*(1+margin),total=unit*qty;
  render({W,H,type,ptype,qty,pr,sh,led,pw,cPr,cSh,cLed,cPow,cPrt,cLab,sur,cost,unit,total,warn:warn.trim(),margin});
}

function render(d){
  const T=d.type==='mdf'?'MDF':'PVC ضدآب';
  const ot=d.led.vertical?'نصب عمودی':'نصب افقی';
  const cust=`<div style="margin-bottom:14px">
    <div class="price-big">${fmt(d.total)} <small>تومان</small></div>
    <div class="hint">${d.qty>1?'قیمت واحد '+fmt(d.unit)+' × '+toFa(d.qty)+' عدد':''}</div>
  </div>
  <div class="badges">
    <span class="badge">ابعاد: <b>${toFa(d.W)}×${toFa(d.H)} cm</b></span>
    <span class="badge">${ot}</span>
    <span class="badge">ماژول SMD: <b>${toFa(d.led.totalStrips)}</b> عدد</span>
    <span class="badge">کل SMD: <b>${toFa(d.led.totalSMD)}</b> عدد</span>
    <span class="badge">${d.pw.label}</span>
    <span class="badge">پرت: <b>${Math.round(d.sh.wastePct)}٪</b></span>
  </div>${d.warn?'<div class="warnbox">⚠ '+d.warn+'</div>':''}`;
  const rows=[
    ['پروفیل '+PROF[d.ptype].label,(d.pr.charged/PLEN).toFixed(2)+' شاخه',d.cPr],
    ['زیرکار '+T,toFa(d.sh.sheets)+' برگ',d.cSh],
    ['نوار SMD',toFa(d.led.rawConsumed)+' شاخه',d.cLed],
    ['منبع تغذیه',d.pw.label,d.cPow],
    ['چاپ تکستایل',(d.W*d.H/10000).toFixed(2)+' m²',d.cPrt],
    ['دستمزد',(d.W*d.H/10000).toFixed(2)+' m²',d.cLab],
  ];
  if(d.sur>0)rows.push(['افزایش پرت','—',d.sur]);
  const adm=`<div class="admin-section" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
    <div style="font-size:10px;color:var(--mut);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px">ریز قیمت مواد</div>
    <table><tr><th>ردیف</th><th>مشخصات</th><th>مبلغ (تومان)</th></tr>
    ${rows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td class="num">'+fmt(r[2])+'</td></tr>').join('')}
    <tr class="subtotal"><td colspan="2">قیمت تمام‌شده</td><td class="num">${fmt(d.cost)}</td></tr>
    <tr class="total"><td colspan="2">قیمت فروش (${toFa(Math.round(d.margin*100))}٪ سود)</td><td class="num">${fmt(d.unit)}</td></tr>
    </table></div>`;
  const sc=schematic(d);
  el('out').innerHTML=cust+adm+'<div class="schem"><div class="schem-scroll">'+sc.svg+'</div>'+sc.info+'</div>';
  if(isAdmin)el('appWrap').classList.add('admin-mode');
}

function schematic(d){
  const led=d.led;
  if(!led.rows||!led.segs.length)return{svg:'<div class="empty">ابعاد خیلی کوچک</div>',info:''};
  const PAD=46,maxW=600,maxH=340;
  const sc=Math.min(maxW/(d.W*10),maxH/(d.H*10));
  const cw=d.W*10*sc,ch=d.H*10*sc;
  const SMD_R=3.16,SMD_F=39.62,SMD_SP=79.16,SH=15;
  let strips='';
  for(let r=0;r<led.rows;r++){
    const ap=led.marginAcross+r*LED_GAP_V;let as2=led.marginAlong;
    for(const seg of led.segs){
      const nc=Math.round(seg/LED_CUT);
      let sx,sy,sw,sh;
      if(!led.vertical){sx=as2*sc+PAD;sy=(ap-SH/2)*sc+PAD;sw=seg*sc;sh=SH*sc;}
      else{sx=(ap-SH/2)*sc+PAD;sy=as2*sc+PAD;sw=SH*sc;sh=seg*sc;}
      strips+='<rect x="'+sx.toFixed(1)+'" y="'+sy.toFixed(1)+'" width="'+sw.toFixed(1)+'" height="'+sh.toFixed(1)+'" fill="#2d2d2d" stroke="#555" stroke-width="0.8"/>';
      for(let ci=0;ci<nc;ci++){
        const off=SMD_F+ci*SMD_SP;if(off>seg)break;
        let cx,cy;
        if(!led.vertical){cx=(as2+off)*sc+PAD;cy=ap*sc+PAD;}
        else{cx=ap*sc+PAD;cy=(as2+off)*sc+PAD;}
        strips+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(SMD_R*sc).toFixed(1)+'" fill="var(--led)" stroke="#aaa" stroke-width="0.5" opacity="0.9"/>';
      }
      for(let ci=1;ci<nc;ci++){
        const off=ci*LED_CUT;if(off>=seg)break;
        const hh=(SH/2+1)*sc;let lx1,ly1,lx2,ly2;
        if(!led.vertical){const cx=(as2+off)*sc+PAD,my=ap*sc+PAD;lx1=cx;ly1=my-hh;lx2=cx;ly2=my+hh;}
        else{const cy=(as2+off)*sc+PAD,mx=ap*sc+PAD;lx1=mx-hh;ly1=cy;lx2=mx+hh;ly2=cy;}
        strips+='<line x1="'+lx1.toFixed(1)+'" y1="'+ly1.toFixed(1)+'" x2="'+lx2.toFixed(1)+'" y2="'+ly2.toFixed(1)+'" stroke="#ff3a3a" stroke-width="1.2"/>';
      }
      as2+=seg+LED_GAP_H;
    }
  }
  const units=d.pw.units,pwH=22,pwG=7,pwW=62;
  const tph=units.length*pwH+(units.length-1)*pwG;
  let pwY=PAD+(ch-tph)/2,pwX=PAD+cw+14,pwr='';
  units.forEach((amp,i)=>{
    const y=pwY+i*(pwH+pwG),cy=y+pwH/2;
    pwr+='<rect x="'+pwX+'" y="'+y.toFixed(1)+'" width="'+pwW+'" height="'+pwH+'" rx="4" fill="#1e0e14" stroke="var(--pwr)" stroke-width="1.5"/>';
    pwr+='<text x="'+(pwX+pwW/2).toFixed(1)+'" y="'+(cy+4.5).toFixed(1)+'" fill="var(--pwr)" font-size="10" text-anchor="middle">پاور '+amp+'A</text>';
    pwr+='<line x1="'+(PAD+cw).toFixed(1)+'" y1="'+cy.toFixed(1)+'" x2="'+pwX+'" y2="'+cy.toFixed(1)+'" stroke="var(--pwr)" stroke-width="0.8" stroke-dasharray="3 2"/>';
  });
  const dim='<line x1="'+PAD+'" y1="'+(PAD-18)+'" x2="'+(PAD+cw)+'" y2="'+(PAD-18)+'" stroke="var(--mut)" stroke-width="0.8"/>'
    +'<line x1="'+PAD+'" y1="'+(PAD-22)+'" x2="'+PAD+'" y2="'+(PAD-14)+'" stroke="var(--mut)" stroke-width="0.8"/>'
    +'<line x1="'+(PAD+cw)+'" y1="'+(PAD-22)+'" x2="'+(PAD+cw)+'" y2="'+(PAD-14)+'" stroke="var(--mut)" stroke-width="0.8"/>'
    +'<text x="'+(PAD+cw/2).toFixed(1)+'" y="'+(PAD-24)+'" fill="var(--ink)" font-size="11" text-anchor="middle">'+d.W+' cm</text>'
    +'<line x1="'+(PAD-18)+'" y1="'+PAD+'" x2="'+(PAD-18)+'" y2="'+(PAD+ch)+'" stroke="var(--mut)" stroke-width="0.8"/>'
    +'<line x1="'+(PAD-22)+'" y1="'+PAD+'" x2="'+(PAD-14)+'" y2="'+PAD+'" stroke="var(--mut)" stroke-width="0.8"/>'
    +'<line x1="'+(PAD-22)+'" y1="'+(PAD+ch)+'" x2="'+(PAD-14)+'" y2="'+(PAD+ch)+'" stroke="var(--mut)" stroke-width="0.8"/>'
    +'<text x="'+(PAD-26)+'" y="'+(PAD+ch/2).toFixed(1)+'" fill="var(--ink)" font-size="11" text-anchor="middle" transform="rotate(-90 '+(PAD-26)+' '+(PAD+ch/2).toFixed(1)+')">'+d.H+' cm</text>';
  const SVG_W=(cw+PAD*2+80).toFixed(0),SVG_H=(ch+PAD*2+6).toFixed(0);
  const ot=led.vertical?'نصب عمودی':'نصب افقی';
  return{
    svg:'<svg class="schema" viewBox="0 0 '+SVG_W+' '+SVG_H+'" xmlns="http://www.w3.org/2000/svg">'
      +'<rect x="'+PAD+'" y="'+PAD+'" width="'+cw.toFixed(1)+'" height="'+ch.toFixed(1)+'" fill="#0b0f17" stroke="var(--acc2)" stroke-width="1.5"/>'
      +'<rect x="'+(PAD+4)+'" y="'+(PAD+4)+'" width="'+(cw-8).toFixed(1)+'" height="'+(ch-8).toFixed(1)+'" fill="none" stroke="#1a2535" stroke-width="0.8" stroke-dasharray="4 3"/>'
      +strips+pwr+dim+'</svg>',
    info:'<div class="schem-info">ماژول SMD: '+toFa(led.totalStrips)+' عدد &nbsp;·&nbsp; کل SMD: '+toFa(led.totalSMD)+' عدد &nbsp;·&nbsp; '+ot+'</div>'
  };
}

initSettings().then(()=>calc());
</script>
